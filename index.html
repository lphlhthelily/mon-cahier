<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Cahier — learn French A1–A2</title>
<meta name="description" content="A quiet notebook for learning French at A1–A2: spaced-repetition flashcards, grammar lessons with exercises, dictation practice and a progress dashboard. Bring your own words from Google Sheets. Everything stays in your browser.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Mon Cahier — learn French A1–A2">
<meta property="og:description" content="A quiet notebook for learning French at A1–A2: spaced-repetition flashcards, grammar lessons with exercises, dictation practice and a progress dashboard. Bring your own words from Google Sheets. Everything stays in your browser.">
<meta property="og:image" content="icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Cahier">
<style>
:root{
  color-scheme:light;
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F7F4; --surface-3:#FAFAF8;
  --ink:#1A1A1C; --ink-2:#3F4046; --muted:#6C6D75;
  --line:#E2E2DC; --line-2:#EFEFEA;
  --accent:#2C5FA8; --accent-strong:#22497F; --on-accent:#FFFFFF; --accent-wash:#EDF2FA;
  --good:#1F6B3A; --good-wash:#EAF4ED; --bad:#A83232; --bad-wash:#FAECEC;
  --warn-wash:#FBF2DC; --warn-ink:#6A4B0E;
  --s1:#2C5FA8; --s2:#C96A28; --s3:#2F8F6B;
  --h0:#EDEDE8; --h1:#CBDCF1; --h2:#8FB4DF; --h3:#4F80C0; --h4:#22497F;
  --m-new:#E4E4DE; --m-learn:#9DBEE4; --m-mature:#2C5FA8;
  --shadow:0 1px 2px rgba(26,26,28,.05), 0 12px 28px -22px rgba(26,26,28,.5);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font:var(--serif);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding-inline:16px; padding-block:0 96px;
  background:var(--paper);
  color:var(--ink); font-family:var(--serif); font-size:16px; line-height:1.6;
  min-height:100%;
}
button,input,select,textarea{font:inherit; color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance; line-height:1.25; font-weight:700; letter-spacing:-.005em}
.ico{flex:none; vertical-align:middle}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
b,strong{font-weight:700}

/* ---------- header & nav ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin-inline:-16px; padding:12px 16px; background:var(--paper); border-bottom:1px solid var(--line)}
.top-in{max-width:1000px; margin-inline:auto; display:flex; align-items:center; gap:12px}
.brand{font-family:var(--serif); font-size:23px; font-style:italic; font-weight:400; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; line-height:1.3}
.brand small{font-family:var(--sans); font-style:normal; font-size:10px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-left:9px}
.spacer{flex:1}
.streak{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-family:var(--sans); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums}
.streak .ico{color:var(--s2)}
.streak.off .ico{color:var(--muted)}
.iconbtn{display:inline-grid; place-items:center; width:34px; height:34px; border-radius:6px; border:1px solid transparent; background:transparent; cursor:pointer; color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2); border-color:var(--line); color:var(--ink)}
.iconbtn.sm{width:28px; height:28px}
.nav{position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:0; background:none; cursor:pointer; color:var(--muted); font-family:var(--sans); font-size:11px; font-weight:600; border-radius:6px}
.nav button[aria-current="page"]{color:var(--accent-strong); background:var(--accent-wash)}
@media (min-width:860px){
  body{padding-block:0 48px}
  .nav{position:static; display:flex; gap:2px; border:0; background:none; padding:0; margin-left:16px; z-index:auto}
  .nav button{flex-direction:row; gap:7px; font-size:14px; padding:7px 12px}
  .top-in{gap:8px}
}

main{max-width:1000px; margin-inline:auto; padding-block:26px 8px; display:grid; gap:20px}

/* ---------- primitives ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px}
.panel.flush{padding:0; overflow:hidden}
.ph{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.ph h2{font-size:18px}
.eyebrow{font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.script{font-style:italic; font-weight:400}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr)); gap:20px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 16px; border-radius:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer; line-height:1.2; text-align:center}
.btn:hover{border-color:var(--accent); color:var(--accent-strong)}
.btn.primary{background:var(--accent-strong); border-color:var(--accent-strong); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.big{padding:12px 22px; font-size:16px}
.btn.sm{padding:6px 11px; font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-family:var(--sans); font-size:12px; font-weight:600; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); white-space:nowrap}
.chip.a1{background:var(--accent-wash); border-color:transparent; color:var(--accent-strong)}
.chip.a2{background:var(--warn-wash); border-color:transparent; color:var(--warn-ink)}
.chip.ok{background:var(--good-wash); border-color:transparent; color:var(--good)}
.chip.bad{background:var(--bad-wash); border-color:transparent; color:var(--bad)}
kbd{font:600 11px var(--sans); padding:1px 6px; border:1px solid var(--line); border-bottom-width:2px; border-radius:3px; background:var(--surface-2); color:var(--ink-2)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:none; padding:7px 12px; font-family:var(--sans); font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-2); border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-strong)}
input[type=text],input[type=search],select,textarea{width:100%; padding:10px 12px; border-radius:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px}
textarea{resize:vertical; min-height:96px; font-family:var(--sans); font-size:14px; line-height:1.5}
select{width:auto; font-family:var(--sans); font-size:14px}
input[type=file]{width:100%; padding:8px 0; font-family:var(--sans); font-size:14px}
input[type=file]::file-selector-button{font:600 13px var(--sans); padding:7px 12px; margin-right:10px; border:1px solid var(--line); border-radius:5px; background:var(--surface-2); color:var(--ink); cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--accent); color:var(--accent-strong)}
.field{display:grid; gap:6px}
.field label{font-family:var(--sans); font-size:13px; font-weight:600; color:var(--ink-2)}
hr{border:0; border-top:1px solid var(--line); margin:16px 0}

/* ---------- today ---------- */
.hero{display:grid; grid-template-columns:1fr auto; gap:22px; align-items:center}
.hero h1{font-style:italic; font-weight:400; font-size:clamp(32px,6vw,46px); letter-spacing:-.02em; line-height:1.2}
.hero .date{display:block; color:var(--ink-2); margin-top:6px; font-style:italic}
.hero .date::first-letter{text-transform:uppercase}
.ring{position:relative; width:112px; height:112px}
.ring svg{display:block}
.ring .n{position:absolute; inset:0; display:grid; place-items:center; text-align:center; line-height:1.15}
.ring b{display:block; font-family:var(--sans); font-size:26px; font-variant-numeric:tabular-nums; line-height:1}
.ring span{display:block; font-family:var(--sans); font-size:11px; color:var(--muted); margin-top:3px}
@media (max-width:520px){ .hero{grid-template-columns:1fr} .ring{justify-self:start} }
.todo{display:grid; gap:10px}
.todo-item{display:flex; align-items:center; gap:14px; padding:13px 15px; border:1px solid var(--line); border-radius:5px; background:var(--surface-3)}
.todo-item .t{flex:1; min-width:0}
.todo-item .t b{display:block}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.week div{display:grid; justify-items:center; gap:6px; font-family:var(--sans); font-size:11px; color:var(--muted); font-weight:600}
.dot{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); background:var(--surface)}
.dot.half{background:var(--h1); border-color:var(--h2)}
.dot.full{background:var(--accent); border-color:var(--accent)}
.dot.today{outline:2px solid var(--ink); outline-offset:2px}
.quote{display:grid; gap:6px}
.quote .fr{font-size:20px; font-weight:600; line-height:1.45}

/* ---------- vocab ---------- */
.imp-cta{display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap; border:1px dashed var(--accent); background:var(--accent-wash)}
.imp-cta h2{font-size:19px; margin-top:3px}
.imp-cta p{max-width:62ch; margin-top:6px; color:var(--ink-2); font-size:15px}
.themes{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr)); gap:12px}
.theme{display:grid; gap:10px; text-align:left; padding:15px; border:1px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer; font-family:inherit; font-size:inherit; color:inherit}
.theme:hover{border-color:var(--accent)}
.theme b{font-size:16px}
.theme .fr{font-size:14px; color:var(--muted); font-style:italic}
.theme .small{font-family:var(--sans); font-size:12px}
.mbar{display:flex; height:8px; gap:2px; border-radius:4px; overflow:hidden; background:var(--surface)}
.mbar i{display:block; height:100%}
.mbar .n{background:var(--m-new)} .mbar .l{background:var(--m-learn)} .mbar .m{background:var(--m-mature)}
.wl{display:grid}
.wl-row{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto; gap:12px; align-items:center; padding:12px 18px; border-top:1px solid var(--line-2)}
.wl-row:first-child{border-top:0}
.wl-row .fr{font-weight:700; font-size:17px}
.wl-row .ex{grid-column:1/-1; font-size:14px; color:var(--muted); margin-top:-6px; font-style:italic}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--sans); font-size:12px; color:var(--ink-2)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px}

/* flashcard */
.sess{max-width:660px; margin-inline:auto; width:100%; display:grid; gap:14px}
.sess-top{display:flex; align-items:center; gap:12px}
.prog{flex:1; height:5px; border-radius:3px; background:var(--h0); overflow:hidden}
.prog i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s}
.fc{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); padding:56px 28px 28px; min-height:300px; display:grid; align-content:start; gap:15px}
.fc-tags{position:absolute; top:12px; left:16px; right:16px; display:flex; gap:8px; align-items:center}
.fc-prompt{font-family:var(--sans); font-size:13px; color:var(--muted); font-weight:600}
.fc-word{font-size:clamp(32px,7vw,46px); font-weight:700; letter-spacing:-.02em; line-height:1.15; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.fc-vi{font-size:clamp(22px,5vw,30px); font-weight:600; color:var(--accent-strong); line-height:1.3}
.fc-note{font-size:14px; color:var(--muted)}
.fc-ex{padding-top:14px; margin-top:4px; border-top:1px solid var(--line); display:grid; gap:3px}
.fc-ex .f{font-weight:600; display:flex; gap:8px; align-items:center}
.grades{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.grade{display:grid; gap:2px; justify-items:center; padding:10px 6px; border-radius:5px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-family:var(--sans); font-size:14px; font-weight:700; line-height:1.25}
.grade small{font-size:11px; font-weight:500; color:var(--muted)}
.grade .k{font-size:11px; color:var(--muted); font-weight:600}
.grade:hover{border-color:var(--accent)}
.grade.rec{background:var(--accent-wash); border-color:var(--accent)}
.grade.q1{border-bottom:3px solid var(--bad)} .grade.q2{border-bottom:3px solid #C08A1E} .grade.q3{border-bottom:3px solid var(--accent)} .grade.q4{border-bottom:3px solid var(--good)}
.chars{display:flex; gap:4px; flex-wrap:wrap}
.chars button{min-width:34px; height:34px; border:1px solid var(--line); background:var(--surface-2); border-radius:4px; cursor:pointer; font-family:var(--serif); font-size:15px; font-weight:600}
.chars button:hover{border-color:var(--accent)}
.verdict{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:5px; font-weight:600}
.verdict.ok{background:var(--good-wash); color:var(--good)}
.verdict.near{background:var(--warn-wash); color:var(--warn-ink)}
.verdict.bad{background:var(--bad-wash); color:var(--bad)}
.answer-line{font-size:23px; font-weight:700}
.sum{display:grid; gap:14px; text-align:center; justify-items:center; padding:36px 20px}
.sum .big{font-family:var(--sans); font-size:52px; font-weight:800; line-height:1; letter-spacing:-.03em}

/* ---------- grammar ---------- */
.lgroup{display:grid; gap:10px}
.lesson-card{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; width:100%; text-align:left; padding:15px 17px; border:1px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer; font-family:inherit; font-size:inherit; color:inherit}
.lesson-card:hover{border-color:var(--accent)}
.lesson-card b{font-size:16px}
.lesson-card .s{font-size:14px; color:var(--muted)}
.score{min-width:58px; text-align:right; font-family:var(--sans); font-weight:700; font-variant-numeric:tabular-nums}
.lesson{max-width:740px; margin-inline:auto; width:100%; display:grid; gap:18px}
.lesson h1{font-size:30px; letter-spacing:-.015em}
.block{display:grid; gap:11px}
.block h3{font-size:18px}
.block p{max-width:68ch}
.tbl{overflow-x:auto; border:1px solid var(--line); border-radius:5px; background:var(--surface)}
.tbl table{border-collapse:collapse; width:100%; font-size:15px}
.tbl th,.tbl td{padding:9px 13px; text-align:left; border-bottom:1px solid var(--line-2); white-space:nowrap}
.tbl th{font-family:var(--sans); font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.ex-list{display:grid; gap:0; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 5px 5px 0; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.ex-item{display:flex; align-items:center; gap:10px; padding:10px 13px; border-top:1px solid var(--line-2)}
.ex-item:first-child{border-top:0}
.ex-item .t{flex:1; min-width:0}
.ex-item .f{font-weight:600}
.ex-item .v{font-size:14px; color:var(--muted); font-style:italic}
.hl{background:var(--accent-wash); color:var(--accent-strong); padding:0 4px; border-radius:2px; font-weight:700}
.tip{padding:11px 15px; border-radius:5px; background:var(--warn-wash); color:var(--warn-ink); font-size:15px}
.q{display:grid; gap:15px}
.q-text{font-size:21px; font-weight:600; line-height:1.45}
.blank{display:inline-block; min-width:54px; border-bottom:2px solid var(--ink); text-align:center; color:var(--accent-strong)}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:12px; align-items:center; text-align:left; padding:12px 15px; border:1px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer; font-family:inherit; font-size:16px; font-weight:600; color:inherit}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{width:22px; height:22px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-family:var(--sans); font-size:12px; color:var(--muted); flex:none}
.opt.right{background:var(--good-wash); border-color:var(--good); color:var(--good)}
.opt.wrong{background:var(--bad-wash); border-color:var(--bad); color:var(--bad)}
.opt[disabled]{cursor:default}
.fillrow{display:flex; gap:8px}

/* ---------- dictation ---------- */
.dict-play{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.play{width:72px; height:72px; border-radius:50%; border:0; background:var(--accent-strong); color:var(--on-accent); display:grid; place-items:center; cursor:pointer}
.play:hover{background:var(--accent)}
.diff{display:flex; flex-wrap:wrap; gap:4px 8px; font-size:22px; font-weight:600; line-height:1.5}
.diff .ok{color:var(--good)}
.diff .accent{color:var(--warn-ink); background:var(--warn-wash); border-radius:2px; padding:0 3px}
.diff .miss{color:var(--bad); background:var(--bad-wash); border-radius:2px; padding:0 3px; text-decoration:underline wavy}
.extras{font-size:15px; color:var(--bad)}
.extras s{opacity:.85}

/* ---------- dashboard ---------- */
.figs{display:grid; grid-template-columns:repeat(4,1fr)}
.fig{padding:4px 20px; border-left:1px solid var(--line)}
.fig:first-child{border-left:0; padding-left:0}
.fig b{display:block; font-family:var(--sans); font-size:34px; line-height:1.1; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.fig b small{font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0}
.fig span{display:block; font-size:14px; color:var(--muted); margin-top:3px}
@media (max-width:640px){
  .figs{grid-template-columns:1fr 1fr; gap:18px 0}
  .fig:nth-child(3){border-left:0; padding-left:0}
}
.chart svg{display:block; max-width:100%; height:auto; overflow:visible}
.chart text{font-family:var(--sans); fill:var(--muted); font-size:12px}
.chart .grid{stroke:var(--line-2); stroke-width:1}
.chart .base{stroke:var(--line); stroke-width:1}
.chart .goal{stroke:var(--ink-2); stroke-width:1.5; stroke-dasharray:5 4}
.bar-hit{fill:transparent}
.bar-hit:hover{fill:var(--ink); fill-opacity:.06}
.heat{display:grid; grid-template-columns:30px repeat(12,minmax(0,1fr)); gap:3px; max-width:560px}
.heat .lab{font-family:var(--sans); font-size:11px; color:var(--muted); align-self:center; justify-self:start; line-height:1}
.hc{aspect-ratio:1; border-radius:2px; background:var(--h0)}
.hc.f{background:transparent}
.hc.l1{background:var(--h1)} .hc.l2{background:var(--h2)} .hc.l3{background:var(--h3)} .hc.l4{background:var(--h4)}
.hc.now{outline:2px solid var(--ink); outline-offset:1px}
.mrow{display:grid; grid-template-areas:'nm bar pc'; grid-template-columns:minmax(120px,1.1fr) minmax(0,2.4fr) 66px; gap:14px; align-items:center; padding:10px 0; border-top:1px solid var(--line-2)}
.mrow:first-of-type{border-top:0}
.mrow .nm{font-size:15px; font-weight:600}
.mrow .nm small{display:block; font-family:var(--sans); font-weight:400; color:var(--muted); font-size:12px}
.mrow .nm{grid-area:nm} .mrow .mbar{grid-area:bar} .mrow .pc{grid-area:pc}
@media (max-width:560px){.mrow{grid-template-columns:1fr auto; grid-template-areas:'nm pc' 'bar bar'; gap:8px 12px}}
.mrow .pc{text-align:right; font-family:var(--sans); font-weight:700; font-variant-numeric:tabular-nums}
.mrow .mbar{height:12px}
.grow{display:grid; grid-template-columns:minmax(0,1fr) minmax(70px,1.2fr) 46px; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line-2); font-size:15px}
.grow:first-of-type{border-top:0}
.gbar{height:8px; border-radius:4px; background:var(--h0); overflow:hidden}
.gbar i{display:block; height:100%; background:var(--accent); border-radius:4px}
.grow b{font-family:var(--sans)}
.demo-banner{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:13px 17px; border:1px dashed var(--accent); background:var(--accent-wash); border-radius:5px; font-size:15px}
details.tv{margin-top:14px; font-size:14px}
details.tv summary{cursor:pointer; color:var(--ink-2); font-weight:600}
details.tv .tbl{margin-top:8px; max-height:260px; overflow:auto}
#tip{white-space:pre-line; position:fixed; top:0; left:0; z-index:60; pointer-events:none; background:var(--ink); color:#fff; padding:7px 10px; border-radius:4px; font-family:var(--sans); font-size:12px; line-height:1.45; max-width:220px; opacity:0; transition:opacity .08s}
#tip.on{opacity:1}

/* ---------- import & AI ---------- */
.imp-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); gap:14px}
.qp{display:grid; gap:7px; padding:13px 15px; border:1px solid var(--line); border-radius:5px; background:var(--surface); cursor:pointer}
.qp:hover{border-color:var(--accent)}
.opts-prev{display:flex; gap:14px; flex-wrap:wrap; font-size:15px; padding-left:28px}
.opts-prev .ok{color:var(--good); font-weight:700}
.qp .small{padding-left:28px}
.qp .muted{font-size:14px}

/* ---------- modal & toast ---------- */
.veil{position:fixed; inset:0; z-index:50; background:rgba(20,20,22,.5); display:grid; place-items:center; padding:16px}
.modal{width:min(580px,100%); max-height:calc(100% - 24px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:22px; display:grid; gap:15px; box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.modal h2{font-size:20px}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:70; background:var(--ink); color:#fff; padding:10px 17px; border-radius:5px; font-family:var(--sans); font-weight:600; font-size:14px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); max-width:calc(100% - 32px); text-align:center}
@media (min-width:860px){ .toast{bottom:28px} }
.empty{padding:28px; text-align:center; color:var(--muted)}

@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }

function sanitizeLesson(l){

let dbState=null,dbContent=null,dbBusy=false,dirtyState=false,dirtyContent=false,contentOff=false,saveTimer=0,syncState='local';

const FATAL=['invalid_argument','not_granted','revoked','capability_disabled','capability_removed','transform_error','quota_exceeded'];
async function flushDb(){
  if(dbBusy||!(dirtyState||dirtyContent))return;
  dbBusy=true;
  if(dbState&&dirtyState){
    dirtyState=false;
    try{await dbState.set({blob:JSON.stringify(stateOnly()),updatedAt:S.updatedAt});syncState='cloud';}
    catch(e){if(e&&FATAL.includes(e.code)){dbState=null;syncState='local';}else{dirtyState=true;syncState='retry';}}
  }
  if(dbContent&&dirtyContent&&!contentOff){
    dirtyContent=false;
    try{await dbContent.set({blob:JSON.stringify({decks:S.decks,lessons:S.lessons}),updatedAt:S.contentAt});}
    catch(e){if(e&&FATAL.includes(e.code)){contentOff=true;toast('Too large to sync. Your data is still saved in this browser.');}else dirtyContent=true;}
  }
  dbBusy=false;
  if((dirtyState&&dbState)||(dirtyContent&&dbContent&&!contentOff)){clearTimeout(saveTimer);saveTimer=setTimeout(flushDb,4000);}
}

async function initDb(){

      if(d.blob&&cAt>(S.contentAt||0)){try{const r=JSON.parse(d.blob);S.decks=(r&&r.decks)||{};S.lessons=(r&&r.lessons)||{};S.contentAt=cAt;changed=true;}catch(e){}}

const isSeen=c=>!!(c&&c.t>0);
const isDue=c=>isSeen(c)&&c.due<=today();
function statusOf(c){if(!isSeen(c))return 'new';return c.iv>=21?'mature':'learn';}
function preview(c){
  const ef=c?c.ef:2.5,reps=c?c.reps:0,iv=c?c.iv:0;
  const hardN=reps===0?1:Math.max(iv+1,Math.round(iv*1.2));
  let goodN=reps===0?1:reps===1?3:Math.round(iv*ef);goodN=Math.max(goodN,hardN+(reps>=2?1:0));
  let easyN=reps===0?3:reps===1?6:Math.round(iv*ef*1.3);easyN=Math.max(easyN,goodN+2);
  return {
    1:{iv:0,ef:Math.max(1.3,ef-.2),reps:0},
    2:{iv:hardN,ef:Math.max(1.3,ef-.15),reps:reps+1},
    3:{iv:goodN,ef,reps:reps+1},
    4:{iv:easyN,ef:ef+.15,reps:reps+1}
  };
}
function fmtIv(n){if(n<=0)return 'Now';if(n===1)return '1 day';if(n<30)return n+' days';if(n<60)return '1 month';if(n<365)return Math.round(n/30)+' months';return (n/365).toFixed(1).replace('.0','')+' years';}
function dayLog(){const k=dstr(today());return S.days[k]||(S.days[k]={rev:0,ok:0,neu:0,gr:0,grOk:0,dic:0,dicSum:0});}
function applyGrade(id,q){
  const t=today();let c=S.cards[id];const wasNew=!isSeen(c);
  if(!c)c=S.cards[id]={ef:2.5,iv:0,reps:0,lapses:0,due:t,t:0,c:0};
  const p=preview(c)[q];
  if(q===1&&(c.reps>0||c.iv>0))c.lapses++;
  c.ef=p.ef;c.iv=p.iv;c.reps=p.reps;c.due=t+p.iv;c.t++;if(q>=2)c.c++;
  const d=dayLog();d.rev++;if(q>=2)d.ok++;
  if(wasNew){d.neu++;if(S.newToday.d!==t)S.newToday={d:t,n:0};S.newToday.n++;}
  return wasNew;
}

/* ---- review session ---- */
function startSession(themeId){
  const t=today(),pool=CARDS.filter(c=>!themeId||c.theme===themeId);
  const due=pool.filter(c=>isDue(S.cards[c.id])).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).map(c=>c.id);
  const limit=themeId?10:Math.max(0,S.settings.newPerDay-(S.newToday.d===t?S.newToday.n:0));
  const fresh=pool.filter(c=>!isSeen(S.cards[c.id])).slice(0,limit).map(c=>c.id);
  const queue=due.concat(fresh);
  if(!queue.length){toast('No cards are due right now.');return;}
  session={queue,total:queue.length,done:0,ok:0,bad:0,newSet:{},cur:null,from:view};
  view='vocab';sub={};nextCard();render();
}
function nextCard(){
  const s=session;if(!s.queue.length){s.cur=null;return;}
  const id=s.queue[0],c=S.cards[id],mode=S.settings.mode;
  let kind='flip';
  if(isSeen(c)){if(mode==='vi2fr')kind='type';else if(mode==='mix'&&c.reps>=2)kind='type';}
  s.cur={id,kind,flipped:false,res:null,hint:false,val:''};
}
function checkTyped(card,val){
  const a=norm(val),b=norm(card.fr);
  if(a===b)return 'ok';
  if(deacc(a)===deacc(b))return 'accent';
  const sa=a.replace(ARTRE,''),sb=b.replace(ARTRE,'');
  if(sb!==b&&deacc(sa)===deacc(sb))return sa===a?'noart':'wrongart';
  return 'bad';
}
function doGrade(q){
  const s=session;if(!s||!s.cur)return;
  const id=s.cur.id,wasNew=applyGrade(id,q);
  if(wasNew)s.newSet[id]=1;
  s.queue.shift();
  if(q===1){s.bad++;s.queue.splice(Math.min(3,s.queue.length),0,id);}
  else{s.ok++;s.done++;}
  touch();nextCard();render();
}
function vSession(){
  const s=session;
  if(!s.cur){
    const n=s.ok+s.bad,acc=n?Math.round(s.ok/n*100):0,nn=Object.keys(s.newSet).length;
    return `<section class="panel sess"><div class="sum"><div class="eyebrow">Session complete</div><div class="script" style="font-size:34px">Très bien !</div><div class="big">${acc}%</div><div class="muted">${s.total} cards · ${nn} new · ${s.bad} forgotten</div><div class="row"><button class="btn primary" data-act="end-session">Done</button></div></div></section>`;
  }
  const cur=s.cur,card=CARD_BY_ID[cur.id],c=S.cards[cur.id],pv=preview(c);

  const kindLbl=cur.kind==='flip'?'French → English':'English → French';
  const bar=`<div class="sess-top"><button class="btn sm ghost" data-act="end-session">${ico('x',16)} Exit</button><div class="prog" role="progressbar" aria-valuenow="${s.done}" aria-valuemax="${s.total}"><i style="width:${(s.done/s.total*100).toFixed(1)}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${s.done}/${s.total}</span></div>`;
  const tags=`<div class="fc-tags"><span class="chip a1">${kindLbl}</span><span class="chip">${tag}</span></div>`;
  let body='',foot='';
  const grades=(rec)=>`<div class="grades">${[[1,'Forgot'],[2,'Hard'],[3,'Good'],[4,'Easy']].map(g=>`<button class="grade q${g[0]}${rec===g[0]?' rec':''}" data-act="grade" data-q="${g[0]}">${g[1]}<small>${g[0]===1?'Again now':fmtIv(pv[g[0]].iv)}</small><span class="k">${g[0]}</span></button>`).join('')}</div>`;

  }else{

      <div class="field"><input id="ans" type="text" lang="fr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer…" aria-label="French answer"></div>

      foot=`<button class="btn primary big" data-act="submit" style="width:100%">Check <kbd>Enter</kbd></button>`;
    }else{
      const r=cur.res,vt={ok:['ok','Correct!'],accent:['near','Right letters, but the accents are off. It should be:'],noart:['near','Right word — remember the article. It should be:'],wrongart:['near','Wrong article. It should be:'],bad:['bad','Not quite. The answer is:']}[r];
      const rec=r==='ok'?3:r==='bad'?1:2;
      body=`<div class="fc-prompt">${esc(card.vi)}</div><div class="verdict ${vt[0]}">${ico(r==='ok'?'check':r==='bad'?'x':'alert',18)}<div>${vt[1]}${r==='ok'?'':` <span class="answer-line" style="display:block;color:var(--ink)">${esc(card.fr)} ${spk(card.fr,false,true)}</span>`}</div></div><div class="small muted">You wrote: <b>${esc(cur.val)||'(nothing)'}</b></div>${back(false)}`;
      foot=grades(rec);

  return `<div class="sess">${bar}<div class="fc">${tags}${body}</div>${foot}</div>`;
}

/* ================= DICTATION ================= */
function dictNew(){
  const d=dict,base=d.mode==='words'?CARDS:CARDS.filter(c=>c.ex),seen=base.filter(c=>isSeen(S.cards[c.id]));
  const pool=(seen.length>=6?seen:base);
  let c,tries=0;do{c=pick(pool);tries++;}while(d.item&&d.item.card.id===c.id&&tries<6);
  d.item={card:c,text:d.mode==='words'?c.fr:c.ex,vi:d.mode==='words'?c.vi:c.exvi};d.res=null;
}
function tokens(s){return norm(s).replace(/[.,!?;:«»"()…—]/g,' ').split(/\s+/).filter(Boolean);}
function diffTok(exp,got){
  const A=exp.map(x=>deacc(x)),B=got.map(x=>deacc(x));
  const n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const st=new Array(n).fill('miss'),used=new Array(m).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){st[i]=exp[i]===got[j]?'ok':'accent';used[j]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  return{st,extras:got.filter((_,k)=>!used[k])};
}
function dictCheck(){
  const d=dict,val=($('#ans')||{}).value||'';
  const shown=d.item.text.replace(/\s*\/\s*/g,' ').split(/\s+/).filter(Boolean);
  const expT=tokens(d.item.text),gotT=tokens(val);
  const df=diffTok(expT,gotT);
  const ok=df.st.filter(x=>x==='ok').length,ac=df.st.filter(x=>x==='accent').length;
  const score=Math.max(0,Math.min(1,(ok+.5*ac-.5*df.extras.length)/Math.max(1,expT.length)));
  d.res={val,expT,st:df.st,extras:df.extras,score};
  const dl=dayLog();dl.dic++;dl.dicSum+=score;touch();render();
}
function vListen(){
  if(!dict)dict={mode:'sentences',item:null,slow:false,res:null};
  if(!dict.item)dictNew();
  const d=dict,r=d.res;
  const seen=CARDS.filter(c=>isSeen(S.cards[c.id])).length;
  let res='';
  if(r){
    const pct=Math.round(r.score*100),cls=pct>=95?'ok':pct>=60?'near':'bad',msg=pct>=95?'Spot on!':pct>=60?'Close.':'Listen again and give it another go.';
    res=`<div class="verdict ${cls}">${ico(pct>=95?'check':pct>=60?'alert':'x',18)}<div>${msg} Accuracy <b>${pct}%</b></div></div>
    <div class="diff" aria-label="Word by word result">${r.expT.map((t,i)=>`<span class="${r.st[i]}">${esc(t)}</span>`).join('')}</div>
    ${r.extras.length?`<div class="extras">Extra or wrong words: ${r.extras.map(e=>`<s>${esc(e)}</s>`).join(' ')}</div>`:''}
    <div class="small muted"><span class="chip ok">green</span> correct · <span class="chip a2">amber</span> missing accent · <span class="chip bad">red</span> wrong or missing</div>
    <div><b>Answer:</b> ${esc(d.item.text)}</div><div class="muted">${esc(d.item.vi)}</div>
    <div class="row"><button class="btn primary" data-act="dict-next">Next <kbd>Enter</kbd></button></div>`;
  }

  return `
  <section class="panel q" style="max-width:720px;margin-inline:auto;width:100%">
    <div class="ph"><h2>Listen and write</h2><div class="seg" role="group" aria-label="Mode"><button data-act="dict-mode" data-m="words" aria-pressed="${d.mode==='words'}">Words</button><button data-act="dict-mode" data-m="sentences" aria-pressed="${d.mode==='sentences'}">Sentences</button></div></div>
    ${noTts}
    <p class="muted small">Listen, then type exactly what you hear. ${seen>=6?'Drawn from the words you have studied.':'Drawn from the whole word list for now, and from your studied words as you go.'}</p>
    <div class="dict-play"><button class="play" data-act="dict-play" aria-label="Play">${ico('play',30)}</button><button class="btn" data-act="dict-play" data-slow="1">${ico('turtle',18)} Play slowly</button></div>
    ${r?'':`<div class="field"><label for="ans">What did you hear?</label><textarea id="ans" rows="2" lang="fr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in French…"></textarea></div>
    <div class="chars">${'éèêëàâçîïôùûœ\''.split('').map(x=>`<button type="button" data-act="ch" data-c="${x}">${x}</button>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="dict-check">Check <kbd>Enter</kbd></button><button class="btn ghost" data-act="dict-skip">Skip</button></div>`}

/* ================= PROGRESS ================= */
function niceMax(v){const s=[10,20,30,40,50,60,80,100,120,150,200,250,300,400,500,600,800,1000];return s.find(x=>x>=v)||Math.ceil(v/100)*100;}
function topRound(x,y,w,h,r){r=Math.min(r,h,w/2);return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`;}
function chartW(half){const mw=($('#main')||{}).clientWidth||700;let w=mw-38;if(half)w=(mw>=618?(mw-18)/2:mw)-38;return Math.max(280,Math.round(w));}
function chartDaily(X,n){
  const t=today(),rows=[];
  for(let i=n-1;i>=0;i--){const d=X.days[dstr(t-i)]||{};rows.push({n:t-i,a:d.rev||0,b:d.gr||0,c:d.dic||0});}
  const mx=niceMax(Math.max(X.settings.goal,...rows.map(r=>r.a+r.b+r.c)));
  const W=chartW(false),H=220,L=34,R=6,T=12,B=26,pw=W-L-R,ph=H-T-B,bw=pw/n,w=Math.min(26,bw*.66),Y=v=>T+ph-(v/mx)*ph;
  const step=n<=7?1:n<=14?2:5;
  let g='';
  [0,.5,1].forEach(f=>{const y=Y(mx*f);g+=`<line class="${f===0?'base':'grid'}" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-7}" y="${y+4}" text-anchor="end">${Math.round(mx*f)}</text>`;});
  rows.forEach((r,i)=>{
    const cx=L+bw*i+bw/2,x=cx-w/2,segs=[[r.a,'var(--s1)'],[r.b,'var(--s2)'],[r.c,'var(--s3)']].filter(s=>s[0]>0);
    let acc=0;
    segs.forEach((s,k)=>{const h=s[0]/mx*ph,y=Y(acc+s[0]);acc+=s[0];
      g+=k===segs.length-1?`<path d="${topRound(x,y,w,h,4)}" fill="${s[1]}" stroke="var(--surface)" stroke-width="1.5"/>`:`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${s[1]}" stroke="var(--surface)" stroke-width="1.5"/>`;});
    if((n-1-i)%step===0)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${vd(r.n)}</text>`;
    g+=`<rect class="bar-hit" data-tip="${vd(r.n)}\nVocabulary: ${r.a}\nGrammar: ${r.b}\nDictation: ${r.c}\nTotal: ${r.a+r.b+r.c}" x="${L+bw*i}" y="${T}" width="${bw}" height="${ph}"/>`;

function parseTable(text,delim){
  text=String(text||'').replace(/^﻿/,'');
  if(!text.trim())return [];
  let d=delim==='tab'?'\t':delim==='comma'?',':delim==='semi'?';':delim==='pipe'?'|':null;
  if(!d){
    const lines=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,20);
    const first=lines[0]||'';
    if(first.includes('\t'))d='\t';
    else{
      const score=c=>lines.reduce((n,l)=>n+(l.split(c).length-1),0);
      const best=[['|',score('|')],[';',score(';')],[',',score(',')]].sort((a,b)=>b[1]-a[1])[0];
      d=best[1]>0?best[0]:',';
    }
  }
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"'&&cell==='')q=true;
    else if(ch===d){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[];}
    else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
const HPAT=[/ph[aá]p|french|fran[cç]ais|^fr$|từ vựng|^từ$|^word$|^mot$|vocab/i,/nghĩa|nghia|vi[eệ]t|meaning|english|^en$|^vi$|^translation$|^gloss$/i,/^(ví dụ|vi du|example|exemple|sentence|câu)/i,/(dịch|dich|trans)/i,/ghi chú|ghi chu|note|comment/i];

function autoMap(h,nc){
  const used=new Set(),m=[-1,-1,-1,-1,-1];
  for(let i=0;i<5;i++){const j=h.findIndex((c,jj)=>!used.has(jj)&&HPAT[i].test(c));if(j>=0){m[i]=j;used.add(j);}}
  if(m[0]<0||m[1]<0)return [0,1,2,3,4].map(i=>i<nc?i:-1);
  return m;
}
function buildImport(){

  if(!imp.mapSet)imp.map=imp.header?autoMap(rows[0],nc):[0,1,2,3,4].map(i=>i<nc?i:-1);

function pickJson(text){
  const t=String(text==null?'':text).trim(),tries=[t];
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)tries.push(f[1].trim());
  const ob=t.indexOf('{'),oe=t.lastIndexOf('}'),ab=t.indexOf('['),ae=t.lastIndexOf(']');
  if(ab>=0&&ae>ab&&(ob<0||ab<ob))tries.push(t.slice(ab,ae+1));
  if(ob>=0&&oe>ob)tries.push(t.slice(ob,oe+1));
  for(let i=0;i<tries.length;i++){try{return JSON.parse(tries[i]);}catch(e){}}
  throw{code:'invalid_json'};
}

  if(!res.ok)throw{code:res.status===401||res.status===403?'bad_key':res.status===429?'rate_limited':res.status>=500?'upstream_error':'api_error'};

const QFORMAT=`Each element of "qs" is one of two shapes:

- Fill in the blank: {"t":"fill","q":"a French sentence containing exactly one ___ with an English cue in brackets","a":["the correct answer","an alternative spelling that is also correct, if any"],"w":"a short explanation in English","h":"a short hint"}

function promptVocab(a){

${QFORMAT}
${a.note.trim()?'Extra request from the learner: '+a.note.trim().slice(0,300)+'\n':''}Vocabulary:

  if(!lesson.retry){
    const id=lesson.id,n=lesson.qs.length,pct=Math.round(lesson.score/n*100),g=S.grammar[id]||{best:0,tries:0};
    S.grammar[id]={best:Math.max(g.best||0,pct),tries:(g.tries||0)+1,last:today()};touch();
  }
  lesson.phase='done';render();window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Escape'&&modal){modal=null;renderModal();return;}
  if(modal)return;
  if(view==='vocab'&&session&&session.cur){
    const cur=session.cur;
    if(typing&&tag==='input'&&e.key==='Enter'&&cur.kind==='type'&&!cur.res){e.preventDefault();submitTyped();return;}
    if(typing)return;
    if(cur.kind==='flip'&&!cur.flipped&&(e.key===' '||e.key==='Enter')){e.preventDefault();const b=$('[data-act="flip"]');if(b)b.click();return;}
    const flipped=cur.flipped||cur.res;
    if(flipped){
      if(['1','2','3','4'].includes(e.key)){doGrade(+e.key);return;}
      if(e.key===' '||e.key==='Enter'){e.preventDefault();const rec=cur.kind==='type'&&cur.res?(cur.res==='ok'?3:cur.res==='bad'?1:2):3;doGrade(rec);return;}
    }
    if(e.key==='s'||e.key==='S'){speak(CARD_BY_ID[cur.id].fr);}
    return;
  }
  if(view==='grammar'&&lesson&&lesson.phase==='quiz'){
    const q=lesson.qs[lesson.i];
    if(typing&&tag==='input'&&e.key==='Enter'){e.preventDefault();if(lesson.ans)quizNext();else fillSubmit();return;}
    if(typing)return;
    if(q.t==='mcq'&&!lesson.ans&&['1','2','3','4'].includes(e.key)){const oi=q.order[+e.key-1];if(oi!=null)answerQ(oi===q.a,q.o[oi],'',oi);return;}
    if(lesson.ans&&(e.key==='Enter'||e.key===' ')){e.preventDefault();quizNext();}
    return;
  }
  if(view==='listen'&&dict){
    if(tag==='textarea'&&e.key==='Enter'&&!e.shiftKey&&!dict.res){e.preventDefault();dictCheck();return;}
    if(!typing&&dict.res&&e.key==='Enter'){e.preventDefault();dictNew();render();setTimeout(()=>speak(dict.item.text,false),50);}
  }
});
let impT=0;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){sub.q=t.value;const r=$('#qres');if(r)r.innerHTML=qres(sub.q);}
  else if(t.id==='imp-text'&&imp){imp.text=t.value;imp.headerSet=false;imp.mapSet=false;clearTimeout(impT);impT=setTimeout(refreshImp,250);}
  else if(t.id==='imp-name'&&imp){imp.name=t.value;}
  else if(t.dataset&&t.dataset.ai&&sub.ai){sub.ai[t.dataset.ai]=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp-file'&&imp){const f=t.files&&t.files[0];if(!f)return;if(f.size>2000000){toast('That file is too large (2 MB maximum).');return;}
    f.text().then(x=>{imp.text=x;imp.headerSet=false;imp.mapSet=false;const ta=$('#imp-text');if(ta)ta.value=x;refreshImp();}).catch(()=>toast('Could not read that file.'));return;}
  if(t.id==='s-key'){setApiKey(t.value);render();renderModal();return;}
  if(t.dataset&&t.dataset.imp&&imp){const k=t.dataset.imp;
    if(k==='map'){imp.map[+t.dataset.i]=+t.value;imp.mapSet=true;}
    else if(k==='header'){imp.header=t.checked;imp.headerSet=true;imp.mapSet=false;}
    else if(k==='deck'){imp.deck=t.value;}
    else if(k==='delim'){imp.delim=t.value;imp.mapSet=false;}
    refreshImp();return;}
  const k=e.target.dataset&&e.target.dataset.set;if(!k)return;
  const v=e.target.type==='checkbox'?e.target.checked:((k==='mode'||k==='model')?e.target.value:+e.target.value);
  S.settings[k]=v;touch();
  if(session&&k==='mode'){/* applies from the next card */}
  render();
});
/* tooltip */
const tipEl=()=>$('#tip');
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const el=tipEl();if(!el)return;if(!t){el.classList.remove('on');return;}el.textContent=t.dataset.tip;el.classList.add('on');});
document.addEventListener('pointermove',e=>{const el=tipEl();if(!el||!el.classList.contains('on'))return;const w=el.offsetWidth,h=el.offsetHeight;let x=e.clientX+12,y=e.clientY-h-10;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y<8)y=e.clientY+16;el.style.left=x+'px';el.style.top=y+'px';});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-tip]')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip]'))){const el=tipEl();if(el)el.classList.remove('on');}});

let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='dash'&&!modal)render();},150);});
/* ================= start ================= */
render();
initDb();
initAI();
})();

</script>
